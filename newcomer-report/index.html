<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>新人レポート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface2: #f5f5f5;
    --border: rgba(0,0,0,0.10);
    --border2: rgba(0,0,0,0.20);
    --text: #1a1a1a;
    --text2: #555;
    --text3: #999;
    --accent: #1a1a1a;
    --accent-light: #f0f0f0;
    --danger: #d32f2f;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 40px;
  }
  .header {
    padding: 0 16px;
    height: 52px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    background: var(--bg);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
  }
  .header-left { display: flex; align-items: center; }
  .header-center { text-align: center; }
  .header-right { display: flex; justify-content: flex-end; }
  .app-title { font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: 0.04em; }
  .staff-info { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .back-btn {
    font-size: 12px; color: var(--text2); cursor: pointer;
    padding: 6px 10px; border: 1px solid var(--border2);
    border-radius: 20px; background: none; font-family: inherit;
    white-space: nowrap;
  }
  .back-btn:hover { background: var(--surface2); }
  .progress-bar-wrap { height: 2px; background: var(--border); position: absolute; bottom: 0; left: 0; right: 0; }
  .progress-bar { height: 2px; background: var(--accent); width: 0%; transition: width 0.4s ease; }

  .screen { display: none; }
  .screen.active { display: block; }

  /* ログイン */
  .login-wrap {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 40px 24px;
    background: var(--bg);
  }
  .login-logo {
    font-size: 22px; font-weight: 700; color: var(--text);
    letter-spacing: 0.06em; margin-bottom: 4px;
  }
  .login-sub { font-size: 12px; color: var(--text3); margin-bottom: 40px; letter-spacing: 0.08em; }
  .login-card {
    width: 100%; max-width: 340px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px 24px;
  }
  .login-label { font-size: 12px; color: var(--text2); margin-bottom: 8px; }
  select, input[type=text], input[type=number], input[type=password], textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text); font-family: inherit;
    font-size: 14px; padding: 10px 12px; outline: none;
    transition: border-color 0.2s;
  }
  select:focus, input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 80px; line-height: 1.6; }

  .btn {
    width: 100%; padding: 12px; border: none; border-radius: var(--radius-sm);
    font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
    transition: all 0.2s; letter-spacing: 0.03em;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-ghost {
    background: transparent; color: var(--text2);
    border: 1px solid var(--border2); margin-top: 10px;
  }
  .btn-ghost:hover { background: var(--surface2); }

  /* フォームセクション */
  .form-wrap { padding: 20px; }
  .section { margin-bottom: 20px; }
  .section-title {
    font-size: 11px; font-weight: 700; color: var(--text3);
    letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px;
  }
  .card {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
  }

  /* 写真アップロード */
  .photo-upload-zone {
    border: 1px dashed var(--border2); border-radius: var(--radius-sm);
    padding: 24px; text-align: center; cursor: pointer;
    transition: all 0.2s; background: var(--surface2);
  }
  .photo-upload-zone:hover { border-color: var(--accent); background: #f0f0f0; }
  .upload-icon { font-size: 26px; margin-bottom: 8px; }
  .upload-text { font-size: 13px; color: var(--text2); }
  .upload-hint { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .photo-item { position: relative; aspect-ratio: 1; border-radius: var(--radius-sm); overflow: hidden; }
  .photo-item img { width: 100%; height: 100%; object-fit: cover; }
  .photo-remove {
    position: absolute; top: 4px; right: 4px;
    width: 20px; height: 20px; border-radius: 50%;
    background: rgba(0,0,0,0.55); color: #fff; border: none;
    font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  #photoInput { display: none; }

  /* タイム入力 */
  .time-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .time-item { }
  .time-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
  .time-input-wrap { display: flex; align-items: center; gap: 6px; }
  .time-input-wrap input { flex: 1; }
  .time-unit { font-size: 12px; color: var(--text3); white-space: nowrap; }

  .count-badge {
    display: inline-block; padding: 2px 8px; border-radius: 20px;
    background: var(--surface2); color: var(--text3); font-size: 11px; font-weight: 700;
    margin-left: 6px; border: 1px solid var(--border);
  }

  /* 送信中オーバーレイ */
  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.85);
    z-index: 999; flex-direction: column; align-items: center; justify-content: center;
  }
  .overlay.active { display: flex; }
  .overlay-text { font-size: 14px; color: var(--text2); margin-top: 16px; }
  .spinner {
    width: 40px; height: 40px; border: 3px solid var(--border2);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 完了画面 */
  .complete-wrap {
    min-height: 80vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 40px;
  }
  .complete-icon {
    width: 64px; height: 64px; border-radius: 50%;
    background: #f0f0f0; border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; margin-bottom: 20px;
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .complete-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .complete-sub { font-size: 13px; color: var(--text2); line-height: 1.7; white-space: pre-line; }

  /* 履歴 */
  .fb-card {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 14px; margin-top: 10px;
  }
  .fb-date { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
  .fb-text { font-size: 13px; color: #1a5c3a; line-height: 1.6; }
  .no-fb { font-size: 13px; color: var(--text3); font-style: italic; }
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="screen-login" class="screen active">
  <div class="login-wrap">
    <div class="login-logo">新人レポート</div>
    <div class="login-sub">NEWCOMER REPORT</div>
    <div class="login-card">
      <div style="margin-bottom: 16px;">
        <div class="login-label">名前を選択</div>
        <select id="staffSelect">
          <option value="">読み込み中...</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="doLogin()">はじめる</button>
    </div>
  </div>
</div>

<!-- メイン投稿画面 -->
<div id="screen-main" class="screen">
  <div class="header" style="position:relative;">
    <div class="header-left">
      <button class="back-btn" onclick="backToLogin()">← 名前選択</button>
    </div>
    <div class="header-center">
      <div class="app-title">新人レポート <span id="headerStaff"></span></div>
    </div>
    <div class="header-right"></div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <div class="form-wrap">
    <!-- 写真 -->
    <div class="section">
      <div class="section-title">写真 <span id="photoCountBadge" class="count-badge">0/6</span><span style="font-size:10px;color:var(--text3);margin-left:6px;">目安4〜6枚</span></div>
      <div class="photo-upload-zone" onclick="document.getElementById('photoInput').click()">
        <div class="upload-icon">📷</div>
        <div class="upload-text">タップして写真を追加</div>
        <div class="upload-hint">目安4〜6枚 / JPEG・PNG（任意）</div>
      </div>
      <input type="file" id="photoInput" accept="image/*" multiple onchange="handlePhotos(this)">
      <div class="photo-grid" id="photoGrid"></div>
    </div>

    <!-- タイム -->
    <div class="section">
      <div class="section-title">タイム記録</div>
      <div class="card">
        <div class="time-grid">
          <div class="time-item">
            <div class="time-label">カット</div>
            <div class="time-input-wrap">
              <input type="number" id="t-cut" placeholder="0" min="0">
              <span class="time-unit">分</span>
            </div>
          </div>
          <div class="time-item">
            <div class="time-label">セット</div>
            <div class="time-input-wrap">
              <input type="number" id="t-set" placeholder="0" min="0">
              <span class="time-unit">分</span>
            </div>
          </div>
          <div class="time-item">
            <div class="time-label">カラー塗付</div>
            <div class="time-input-wrap">
              <input type="number" id="t-color-apply" placeholder="0" min="0">
              <span class="time-unit">分</span>
            </div>
          </div>
          <div class="time-item">
            <div class="time-label">カラー放置</div>
            <div class="time-input-wrap">
              <input type="number" id="t-color-wait" placeholder="0" min="0">
              <span class="time-unit">分</span>
            </div>
          </div>
          <div class="time-item">
            <div class="time-label">パーマ</div>
            <div class="time-input-wrap">
              <input type="number" id="t-perm" placeholder="0" min="0">
              <span class="time-unit">分</span>
            </div>
          </div>
          <div class="time-item">
            <div class="time-label">その他</div>
            <div class="time-input-wrap">
              <input type="number" id="t-other" placeholder="0" min="0">
              <span class="time-unit">分</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 良かった点 -->
    <div class="section">
      <div class="section-title">良かった点</div>
      <textarea id="good" placeholder="今日うまくいった点を書いてください" rows="4"></textarea>
    </div>

    <!-- 反省点 -->
    <div class="section">
      <div class="section-title">反省点・改善点</div>
      <textarea id="reflect" placeholder="次回に活かしたい課題や改善点を書いてください" rows="4"></textarea>
    </div>

    <button class="btn btn-primary" id="submitBtn" onclick="submitReport()">投稿する</button>
    <button class="btn btn-ghost" onclick="goToHistory()">過去の投稿を見る</button>
  </div>
</div>

<!-- 履歴画面 -->
<div id="screen-history" class="screen">
  <div class="header">
    <div class="header-left">
      <button class="back-btn" onclick="showMain()">← 投稿画面</button>
    </div>
    <div class="header-center">
      <div class="app-title">投稿履歴 <span id="headerStaff2"></span></div>
    </div>
    <div class="header-right"></div>
  </div>
  <div style="padding: 20px;">
    <div id="historyList">
      <div style="text-align:center; color: var(--text3); padding: 40px; font-size: 13px;">読み込み中...</div>
    </div>
    <button class="btn btn-ghost" style="margin-top:16px;" onclick="backToLogin()">名前の選択に戻る</button>
  </div>
</div>

<!-- 完了画面 -->
<div id="screen-complete" class="screen">
  <div class="header">
    <div class="header-left">
      <button class="back-btn" onclick="backToLogin()">← 名前選択</button>
    </div>
    <div class="header-center">
      <div class="app-title">新人レポート</div>
    </div>
    <div class="header-right"></div>
  </div>
  <div class="complete-wrap">
    <div class="complete-icon">✓</div>
    <div class="complete-title">投稿完了！</div>
    <div class="complete-sub" id="completeMsg"></div>
    <div style="margin-top: 32px; width: 100%; max-width: 300px;">
      <button class="btn btn-primary" onclick="nextPost()">続けて投稿する</button>
      <button class="btn btn-ghost" onclick="goToHistory()">履歴を確認する</button>
      <button class="btn btn-ghost" onclick="backToLogin()">名前の選択に戻る</button>
    </div>
  </div>
</div>

<!-- 送信中オーバーレイ -->
<div class="overlay" id="overlay">
  <div class="spinner"></div>
  <div class="overlay-text" id="overlayText">送信中...</div>
</div>

<script>
const CLOUDINARY_CLOUD = 'dr2vksykp';
const CLOUDINARY_PRESET = 'newcomer-report-upload';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyfYE1tJbTujlTCbw0p8JvAvU5z-w-phjis7cWGz3LSa5ltLTKYxmXPDZptb172vHTTUw/exec';

let currentStaff = '';
let photoFiles = [];
let photoUrls = [];

window.onload = async () => {
  await loadStaffList();
};

async function loadStaffList() {
  try {
    const res = await fetch(`${GAS_URL}?action=getStaff`);
    const data = await res.json();
    const sel = document.getElementById('staffSelect');
    sel.innerHTML = '<option value="">名前を選択してください</option>';
    data.staff.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      sel.appendChild(opt);
    });
  } catch(e) {
    document.getElementById('staffSelect').innerHTML = '<option value="">読み込みに失敗しました</option>';
  }
}

function doLogin() {
  const sel = document.getElementById('staffSelect');
  if (!sel.value) return alert('名前を選択してください');
  currentStaff = sel.value;
  showMain();
}

function backToLogin() {
  currentStaff = '';
  resetForm();
  showScreen('login');
  loadStaffList();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo(0, 0);
}

function showMain() {
  showScreen('main');
  document.getElementById('headerStaff').textContent = currentStaff;
  updateProgress();
}

function goToHistory() {
  showScreen('history');
  document.getElementById('headerStaff2').textContent = currentStaff;
  loadHistory();
}

function updateProgress() {
  let filled = 0;
  if (photoFiles.length > 0) filled++;
  if (document.getElementById('good').value.trim()) filled++;
  if (document.getElementById('reflect').value.trim()) filled++;
  document.getElementById('progressBar').style.width = Math.round((filled / 3) * 100) + '%';
}

document.addEventListener('input', updateProgress);

function handlePhotos(input) {
  const newFiles = Array.from(input.files);
  const remaining = 6 - photoFiles.length;
  photoFiles = [...photoFiles, ...newFiles.slice(0, remaining)];
  renderPhotoGrid();
  input.value = '';
  updateProgress();
}

function renderPhotoGrid() {
  const grid = document.getElementById('photoGrid');
  grid.innerHTML = '';
  photoFiles.forEach((file, i) => {
    const url = URL.createObjectURL(file);
    const item = document.createElement('div');
    item.className = 'photo-item';
    item.innerHTML = `<img src="${url}" alt="photo${i+1}"><button class="photo-remove" onclick="removePhoto(${i})">×</button>`;
    grid.appendChild(item);
  });
  document.getElementById('photoCountBadge').textContent = `${photoFiles.length}/6`;
}

function removePhoto(idx) {
  photoFiles.splice(idx, 1);
  renderPhotoGrid();
  updateProgress();
}

async function uploadToCloudinary(file) {
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', CLOUDINARY_PRESET);
  fd.append('folder', `newcomer-report/${currentStaff}`);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {
    method: 'POST', body: fd
  });
  const data = await res.json();
  return data.secure_url;
}

async function submitReport() {
  if (!document.getElementById('good').value.trim()) {
    alert('良かった点を入力してください');
    return;
  }
  if (!document.getElementById('reflect').value.trim()) {
    alert('反省点を入力してください');
    return;
  }

  const overlay = document.getElementById('overlay');
  const overlayText = document.getElementById('overlayText');
  overlay.classList.add('active');

  try {
    photoUrls = [];
    for (let i = 0; i < photoFiles.length; i++) {
      overlayText.textContent = `写真をアップロード中... (${i+1}/${photoFiles.length})`;
      const url = await uploadToCloudinary(photoFiles[i]);
      photoUrls.push(url);
    }

    overlayText.textContent = 'データを保存中...';

    const now = new Date();
    const payload = {
      action: 'submitReport',
      staff: currentStaff,
      datetime: now.toLocaleString('ja-JP'),
      timeCut: document.getElementById('t-cut').value || '0',
      timeSet: document.getElementById('t-set').value || '0',
      timeColorApply: document.getElementById('t-color-apply').value || '0',
      timeColorWait: document.getElementById('t-color-wait').value || '0',
      timePerm: document.getElementById('t-perm').value || '0',
      timeOther: document.getElementById('t-other').value || '0',
      good: document.getElementById('good').value.trim(),
      reflect: document.getElementById('reflect').value.trim(),
      photos: photoUrls.join(','),
      fbComment: '',
      fbDate: ''
    };

    await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });

    overlay.classList.remove('active');
    document.getElementById('completeMsg').textContent =
      `${currentStaff}さん、お疲れさまです！\n記録を保存しました。`;
    showScreen('complete');
    resetForm();

  } catch(e) {
    overlay.classList.remove('active');
    alert('送信中にエラーが発生しました。\n' + e.message);
  }
}

function resetForm() {
  photoFiles = [];
  photoUrls = [];
  document.getElementById('photoGrid').innerHTML = '';
  document.getElementById('photoCountBadge').textContent = '0/6';
  ['t-cut','t-set','t-color-apply','t-color-wait','t-perm','t-other'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('good').value = '';
  document.getElementById('reflect').value = '';
  updateProgress();
}

function nextPost() { showMain(); }

async function loadHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = '<div style="text-align:center;color:var(--text3);padding:40px;font-size:13px;">読み込み中...</div>';
  try {
    const res = await fetch(`${GAS_URL}?action=getHistory&staff=${encodeURIComponent(currentStaff)}`);
    const data = await res.json();
    if (!data.rows || data.rows.length === 0) {
      list.innerHTML = '<div style="text-align:center;color:var(--text3);padding:40px;font-size:13px;">まだ投稿がありません</div>';
      return;
    }
    list.innerHTML = data.rows.reverse().map(row => buildHistoryCard(row)).join('');
  } catch(e) {
    list.innerHTML = '<div style="text-align:center;color:var(--text3);padding:40px;font-size:13px;">読み込みに失敗しました</div>';
  }
}

function buildHistoryCard(row) {
  const photos = row.photos ? row.photos.split(',').filter(Boolean) : [];
  const photoHtml = photos.map(url =>
    `<img src="${url}" style="width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--border);">`
  ).join('');
  const times = [
    row.timeCut > 0 ? `カット ${row.timeCut}分` : '',
    row.timeSet > 0 ? `セット ${row.timeSet}分` : '',
    row.timeColorApply > 0 ? `カラー塗付 ${row.timeColorApply}分` : '',
    row.timeColorWait > 0 ? `放置 ${row.timeColorWait}分` : '',
    row.timePerm > 0 ? `パーマ ${row.timePerm}分` : '',
  ].filter(Boolean);
  const fbHtml = row.fbComment
    ? `<div class="fb-card"><div class="fb-date">管理者FB（${row.fbDate}）</div><div class="fb-text">${row.fbComment}</div></div>`
    : '<div class="fb-card"><div class="no-fb">フィードバックなし</div></div>';
  return `
    <div style="border-bottom:1px solid var(--border);padding-bottom:20px;margin-bottom:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div style="font-size:12px;color:var(--text3);">${row.datetime}</div>
        <div style="font-size:11px;color:var(--text3);">写真${photos.length}枚</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">${photoHtml}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
        ${times.map(t => `<span style="font-size:11px;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--text2);">${t}</span>`).join('')}
      </div>
      <div style="font-size:13px;line-height:1.6;margin-bottom:6px;"><span style="font-size:11px;color:var(--text3);">◎ </span>${row.good}</div>
      <div style="font-size:13px;line-height:1.6;margin-bottom:10px;"><span style="font-size:11px;color:var(--text3);">△ </span>${row.reflect}</div>
      ${fbHtml}
    </div>`;
}
</script>
</body>
</html>
